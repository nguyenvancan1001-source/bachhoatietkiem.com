  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

-spacing: 1.5px\">VÌ SAO CHỌN CHÚNG TÔI<\u002Fspan>\n<h2 style=\"margin: 0; font-family: 'Bricolage Grotesque',Georgia,serif; font-weight: 800; font-size: 44px; line-height: 1.1; max-width: 720px\">Bốn lý do khách quay lại mỗi ngày<\u002Fh2>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px\">\n<sc-for list=\"{{reasons}}\" as=\"r\" hint-placeholder-count=\"4\">\n<div style=\"background: #FFFFFF; border: 1px solid #E9DFCB; border-radius: 22px; padding: 28px 24px; display: flex; flex-direction: column; gap: 14px\">\n<span style=\"width: 52px; height: 52px; border-radius: 14px; background: #FDE9A8; color: #6B4E00; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque',Georgia,serif; font-weight: 800; font-size: 22px\">{{r.num}}<\u002Fspan>\n<span style=\"font-weight: 700; font-size: 19px\">{{r.title}}<\u002Fspan>\n<span style=\"font-size: 15px; line-height: 1.6; color: #57534E\">{{r.desc}}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fsc-if>\n\n<sc-if value=\"{{tabs.about}}\" hint-placeholder-val=\"{{false}}\">\n<!-- ABOUT -->\n<div id=\"gioi-thieu\" style=\"max-width: 1200px; margin: 0 auto; padding: 96px 32px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 64px; align-items: center\">\n<div style=\"height: 420px; border-radius: 28px; background: #EDE3CF; border: 2px dashed #C9B894; display: flex; align-items: center; justify-content: center; color: #78716C; font-weight: 600\">[ẢNH BÊN TRONG CỬA HÀNG]<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 20px\">\n<span style=\"color: {{accent}}; font-weight: 700; font-size: 15px; letter-spacing: 1.5px\">VỀ CHÚNG TÔI<\u002Fspan>\n<h2 style=\"margin: 0; font-family: 'Bricolage Grotesque',Georgia,serif; font-weight: 800; font-size: 44px; line-height: 1.1\">Đi chợ tiết kiệm, phục vụ tận tâm<\u002Fh2>\n<p style=\"margin: 0; font-size: 17px; line-height: 1.7; color: #44403C\">Bách hóa tiết kiệm.com là cửa hàng bách hóa giá thấp gần nhà. Chúng tôi tập trung vào những mặt hàng gia đình cần mỗi ngày, bán với giá thấp ổn định để mọi người đi chợ nhẹ nhàng hơn.<\u002Fp>\n<p style=\"margin: 0; font-size: 17px; line-height: 1.7; color: #44403C\">Mỗi thành viên cửa hàng đều giữ tinh thần phục vụ tận tình, chu đáo: chủ động chào đón, dẫn khách đến tận kệ hàng, và sẵn sàng đổi trả khi khách chưa hài lòng.<\u002Fp>\n<div style=\"display: flex; gap: 12px; align-items: center; background: #FFFFFF; border: 1px solid #E9DFCB; border-radius: 16px; padding: 16px 20px\">\n<svg width=\"26\" height=\"26\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#9A1C12\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 12v8H4v-8\"><\u002Fpath><path d=\"M2 7h20v5H2z\"><\u002Fpath><path d=\"M12 22V7\"><\u002Fpath><path d=\"M12 7H7.5a2.5 2.5 0 1 1 0-5C11 2 12 7 12 7zM12 7h4.5a2.5 2.5 0 1 0 0-5C13 2 12 7 12 7z\"><\u002Fpath><\u002Fsvg>\n<span style=\"font-size: 16px; font-weight: 600\">Phụng sự bằng trái tim chân thành.<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- TEAM / PROCESS -->\n<div style=\"background: {{panel.bg}}; color: {{panel.text}}\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 88px 32px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 64px; align-items: center\">\n<div style=\"display: flex; flex-direction: column; gap: 18px\">\n<span style=\"color: {{panel.hi}}; font-weight: 700; font-size: 15px; letter-spacing: 1.5px\">CHUẨN MỰC PHỤC VỤ<\u002Fspan>\n<h2 style=\"margin: 0; font-family: 'Bricolage Grotesque',Georgia,serif; font-weight: 800; font-size: 42px; line-height: 1.1\">Phụng sự bằng trái tim chân thành<\u002Fh2>\n<p style=\"margin: 0; font-size: 17px; line-height: 1.7; color: {{panel.muted}}\">Mỗi thành viên cửa hàng cùng giữ 6 chuẩn mực phục vụ. Khách quen hay khách lạ, mua nhiều hay mua ít, ai cũng xứng đáng được đón tiếp như nhau.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px\">\n<sc-for list=\"{{steps}}\" as=\"s\" hint-placeholder-count=\"6\">\n<div style=\"display: flex; gap: 18px; align-items: flex-start; background: {{panel.inner}}; border-radius: 18px; padding: 20px 22px\">\n<span style=\"flex-shrink: 0; width: 40px; height: 40px; border-radius: 999px; background: #F5B301; color: #1C1917; display: flex; align-items: center; justify-content: center; font-weight: 800\">{{s.num}}<\u002Fspan>\n<div style=\"display: flex; flex-direction: column; gap: 4px\">\n<span style=\"font-weight: 700; font-size: 17px\">{{s.title}}<\u002Fspan>\n<span style=\"font-size: 15px; line-height: 1.55; color: {{panel.muted}}\">{{s.desc}}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fsc-if>\n\n<sc-if value=\"{{tabs.mission}}\" hint-placeholder-val=\"{{false}}\">\n<!-- MISSION & PHILOSOPHY -->\n<div id=\"su-menh\" style=\"max-width: 1200px; margin: 0 auto; padding: 96px 32px; display: flex; flex-direction: column; gap: 56px\">\n<div style=\"background: {{accent}}; color: #FFFFFF; border-radius: 32px; padding: 64px 72px; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: 24px; align-items: center\">\n<div style=\"grid-column: span 4; display: flex; flex-direction: column; gap: 14px\">\n<span style=\"color: #FDE9A8; font-weight: 700; font-size: 15px; letter-spacing: 1.5px\">SỨ MỆNH<\u002Fspan>\n<span style=\"font-family: 'Bricolage Grotesque',Georgia,serif; font-weight: 800; font-size: 72px; line-height: 0.95\">Luôn luôn<br>giá rẻ!<\u002Fspan>\n<\u002Fdiv>\n<div style=\"grid-column: span 8; display: flex; flex-direction: column; gap: 18px; border-left: 2px solid rgba(255,255,255,0.35); padding-left: 48px\">\n<p style=\"margin: 0; font-family: 'Bricolage Grotesque',Georgia,serif; font-weight: 600; font-size: 32px; line-height: 1.3\">Mang hàng thiết yếu với giá thấp mỗi ngày đến gần nhà mọi gia đình, và phục vụ từng vị khách bằng trái tim chân thành.<\u002Fp>\n<p style=\"margin: 0; font-size: 17px; line-height: 1.7; color: #FDE9E6\">Chúng tôi tin rằng đi chợ tiết kiệm không có nghĩa là phải chịu thiệt về sự tử tế. Giá rẻ để mỗi gia đình dư thêm một chút sau mỗi lần mua sắm; phục vụ tận tâm để mỗi lần ghé cửa hàng là một lần dễ chịu.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 32px\">\n<div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 56px; align-items: end\">\n<div style=\"display: flex; flex-direction: column; gap: 12px\">\n<span style=\"color: {{accent}}; font-weight: 700; font-size: 15px; letter-spacing: 1.5px\">TRIẾT LÝ VẬN HÀNH<\u002Fspan>\n<h2 style=\"margin: 0; font-family: 'Bricolage Grotesque',Georgia,serif; font-weight: 800; font-size: 44px; line-height: 1.1\">5 triết lý vận hành của Bách hóa tiết kiệm.com<\u002Fh2>\n<\u002Fdiv>\n<p style=\"margin: 0; font-size: 17px; line-height: 1.7; color: #44403C\">Mỗi thành viên cửa hàng, dù ở vị trí nào, đều làm việc theo cùng những nguyên tắc này mỗi ngày.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 20px\">\n<sc-for list=\"{{principles}}\" as=\"pr\" hint-placeholder-count=\"5\">\n<div style=\"grid-column: {{pr.span}}; background: #FFFFFF; border: 1px solid #E9DFCB; border-radius: 24px; padding: 32px; display: flex; gap: 24px; align-items: flex-start\">\n<span style=\"flex-shrink: 0; font-family: 'Bricolage Grotesque',Georgia,serif; font-weight: 800; font-size: 56px; line-height: 0.9; color: {{accent}}\">{{pr.num}}<\u002Fspan>\n<div style=\"display: flex; flex-direction: column; gap: 10px\">\n<span style=\"font-family: 'Bricolage Grotesque',Georgia,serif; font-weight: 800; font-size: 24px; line-height: 1.2\">{{pr.title}}<\u002Fspan>\n<span style=\"font-size: 16px; line-height: 1.65; color: #44403C\">{{pr.desc}}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fsc-if>\n\n<sc-if value=\"{{tabs.aisles}}\" hint-placeholder-val=\"{{false}}\">\n<!-- PRODUCTS -->\n<div id=\"san-pham\" style=\"background: {{band.bg}}; border-top: 1px solid {{band.line}}; border-bottom: 1px solid {{band.line}}\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 96px 32px; display: flex; flex-direction: column; gap: 44px\">\n<div style=\"display: flex; flex-direction: column; gap: 12px; align-items: center; text-align: center\">\n<span style=\"color: {{accent}}; font-weight: 700; font-size: 15px; letter-spacing: 1.5px\">SƠ ĐỒ CỬA HÀNG<\u002Fspan>\n<h2 style=\"margin: 0; font-family: 'Bricolage Grotesque',Georgia,serif; font-weight: 800; font-size: 44px; line-height: 1.1\">Sơ đồ cửa hàng – tìm nhanh món bạn cần<\u002Fh2>\n<p style=\"margin: 0; font-size: 17px; color: #57534E; max-width: 620px\">8 dãy hàng được đánh số, có bảng treo ở đầu mỗi dãy. Xem trước sơ đồ để biết món mình cần nằm ở đâu.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 32px; align-items: start\">\n<div style=\"grid-column: span 8; background: #FBF6EC; border: 1px solid #E9DFCB; border-radius: 24px; padding: 28px; display: flex; flex-direction: column; gap: 16px\">\n<div style=\"position: relative; width: 644px; height: 574px; margin: 0 auto\">\n<div style=\"position: absolute; left: 0; top: 0; width: 644px; height: 514px; border: 2px solid {{panel.bg}}; border-radius: 18px; background: #FFFFFF; box-sizing: border-box\"><\u002Fdiv>\n<div style=\"position: absolute; left: 2px; top: 2px; width: 640px; height: 520px\">\n<div style=\"position: absolute; left: 0px; top: 0px; width: 640px; height: 84px; background: #EDE3CF; border: none; border-radius: 8px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; text-align: center; font-weight: 800; font-size: 18px; line-height: 1.2; color: #1C1917; border-radius: 16px 16px 0 0\"><span style=\"font-size: 14px; font-weight: 600; color: #78716C\">Khu vực nội bộ · Kho hàng · Khu thành viên cửa hàng<\u002Fspan><\u002Fdiv>\n<div style=\"position: absolute; left: 53px; top: 100px; width: 533px; height: 26px; background: #FDE9A8; border: 2px solid #E0B84A; border-radius: 8px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; text-align: center; font-weight: 800; font-size: 16px; line-height: 1.2; color: #1C1917\">7<\u002Fdiv>\n<div style=\"position: absolute; left: 12px; top: 143px; width: 26px; height: 228px; background: #FDE9A8; border: 2px solid #E0B84A; border-radius: 8px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; text-align: center; font-weight: 800; font-size: 16px; line-height: 1.2; color: #1C1917\">6<\u002Fdiv>\n<div style=\"position: absolute; left: 606px; top: 143px; width: 26px; height: 324px; background: #FDE9A8; border: 2px solid #E0B84A; border-radius: 8px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; text-align: center; font-weight: 800; font-size: 16px; line-height: 1.2; color: #1C1917\">8<\u002Fdiv>\n<div style=\"position: absolute; left: 96px; top: 164px; width: 56px; height: 224px; background: #FFFFFF; border: 2px solid #C9B894; border-radius: 8px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; text-align: center; font-weight: 800; font-size: 22px; line-height: 1.2; color: #1C1917\">1<\u002Fdiv>\n<div style=\"position: absolute; left: 198px; top: 164px; width: 56px; height: 224px; background: #FFFFFF; border: 2px solid #C9B894; border-radius: 8px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; text-align: center; font-weight: 800; font-size: 22px; line-height: 1.2; color: #1C1917\">2<\u002Fdiv>\n<div style=\"position: absolute; left: 300px; top: 164px; width: 56px; height: 224px; background: #FFFFFF; border: 2px solid #C9B894; border-radius: 8px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; text-align: center; font-weight: 800; font-size: 22px; line-height: 1.2; color: #1C1917\">3<\u002Fdiv>\n<div style=\"position: absolute; left: 402px; top: 164px; width: 56px; height: 224px; background: #FFFFFF; border: 2px solid #C9B894; border-radius: 8px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; text-align: center; font-weight: 800; font-size: 22px; line-height: 1.2; color: #1C1917\">4<\u002Fdiv>\n<div style=\"position: absolute; left: 504px; top: 164px; width: 56px; height: 224px; background: #FFFFFF; border: 2px solid #C9B894; border-radius: 8px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; text-align: center; font-weight: 800; font-size: 22px; line-height: 1.2; color: #1C1917\">5<\u002Fdiv>\n<div style=\"position: absolute; left: 12px; top: 398px; width: 72px; height: 96px; background: {{accent}}; border: none; border-radius: 8px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; text-align: center; font-weight: 800; font-size: 15px; line-height: 1.2; color: #FFFFFF\">Thu<br>ngân<\u002Fdiv>\n<div style=\"position: absolute; left: 398px; top: 466px; width: 84px; height: 44px; background: #E7E5E4; border: none; border-radius: 8px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; text-align: center; font-weight: 800; font-size: 14px; line-height: 1.2; color: #44403C\">Giữ đồ<\u002Fdiv>\n<div style=\"position: absolute; left: 270px; top: 505px; width: 100px; height: 20px; background: #FFFFFF\"><\u002Fdiv>\n<div style=\"position: absolute; left: 250px; top: 530px; width: 140px; display: flex; flex-direction: column; align-items: center; gap: 2px; color: {{accent}}; font-weight: 800; font-size: 15px\">\n<svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 20V4\"><\u002Fpath><path d=\"M5 11l7-7 7 7\"><\u002Fpath><\u002Fsvg>LỐI VÀO<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; gap: 20px; flex-wrap: wrap; font-size: 14px; color: #57534E\">\n<span style=\"display: flex; align-items: center; gap: 8px\"><span style=\"width: 16px; height: 16px; border-radius: 4px; background: #FFFFFF; border: 2px solid #C9B894\"><\u002Fspan>Kệ giữa<\u002Fspan>\n<span style=\"display: flex; align-items: center; gap: 8px\"><span style=\"width: 16px; height: 16px; border-radius: 4px; background: #FDE9A8; border: 2px solid #E0B84A\"><\u002Fspan>Kệ sát tường<\u002Fspan>\n<span>Sơ đồ minh họa, không theo tỉ lệ thực.<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"grid-column: span 4; display: flex; flex-direction: column; gap: 10px\">\n<sc-for list=\"{{categories}}\" as=\"c\" hint-placeholder-count=\"8\">\n<div style=\"display: flex; gap: 16px; align-items: flex-start; background: #FBF6EC; border: 1px solid #E9DFCB; border-radius: 16px; padding: 14px 18px\">\n<span style=\"flex-shrink: 0; width: 38px; height: 38px; border-radius: 10px; background: {{accent}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 18px\">{{c.num}}<\u002Fspan>\n<div style=\"display: flex; flex-direction: column; gap: 3px; min-width: 0\">\n<div style=\"display: flex; justify-content: space-between; gap: 12px; align-items: baseline\"><span style=\"font-weight: 800; font-size: 17px\">{{c.name}}<\u002Fspan><span style=\"flex-shrink: 0; font-size: 13px; font-weight: 600; color: #78716C\">{{c.where}}<\u002Fspan><\u002Fdiv>\n<span style=\"font-size: 14px; line-height: 1.5; color: #57534E\">{{c.desc}}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fsc-if>\n\n<sc-if value=\"{{tabs.returns}}\" hint-placeholder-val=\"{{false}}\">\n<!-- RETURN POLICY -->\n<div id=\"doi-tra\" style=\"background: {{band.bg}}; border-top: 1px solid {{band.line}}; border-bottom: 1px solid {{band.line}}\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 96px 32px; display: flex; flex-direction: column; gap: 40px\">\n<div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 48px; align-items: center\">\n<div style=\"display: flex; flex-direction: column; gap: 14px\">\n<span style=\"color: {{accent}}; font-weight: 700; font-size: 15px; letter-spacing: 1.5px\">CHÍNH SÁCH ĐỔI TRẢ<\u002Fspan>\n<h2 style=\"margin: 0; font-family: 'Bricolage Grotesque',Georgia,serif; font-weight: 800; font-size: 44px; line-height: 1.1\">Chưa hài lòng? Đổi hàng hoặc hoàn tiền, nhanh và vui vẻ<\u002Fh2>\n<\u002Fdiv>\n<div style=\"background: #FDE9A8; color: #1C1917; border-radius: 24px; padding: 28px 32px; display: flex; gap: 24px; align-items: center\">\n<span style=\"font-family: 'Bricolage Grotesque',Georgia,serif; font-weight: 800; font-size: 64px; line-height: 1; color: #6E130C\">30<span style=\"font-size: 24px\"> ngày<\u002Fspan><\u002Fspan>\n<span style=\"font-size: 16px; line-height: 1.55\">Đổi trả trong vòng 30 ngày kể từ ngày mua. Hàng lỗi, hết hạn hoặc hư hỏng: đổi ngay, không cần điều kiện.<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px\">\n<div style=\"background: #FBF6EC; border-radius: 22px; padding: 28px; display: flex; flex-direction: column; gap: 12px\">\n<span style=\"font-weight: 700; font-size: 19px\">Điều kiện đổi trả<\u002Fspan>\n<span style=\"font-size: 15px; line-height: 1.6; color: #44403C\">1. Sản phẩm mua tại cửa hàng trong vòng 30 ngày.<\u002Fspan>\n<span style=\"font-size: 15px; line-height: 1.6; color: #44403C\">2. Có hóa đơn, hoặc thành viên cửa hàng tra được thông tin mua hàng.<\u002Fspan>\n<span style=\"font-size: 15px; line-height: 1.6; color: #44403C\">3. Còn nguyên tem, nhãn, bao bì, chưa qua sử dụng.<\u002Fspan>\n<span style=\"font-size: 15px; line-height: 1.6; color: #44403C\">4. Hàng lỗi do nhà sản xuất, hết hạn hoặc hư hỏng khi mua được đổi ngay, không cần điều kiện 3.<\u002Fspan>\n<\u002Fdiv>\n<div style=\"background: #FBF6EC; border-radius: 22px; padding: 28px; display: flex; flex-direction: column; gap: 12px\">\n<span style=\"font-weight: 700; font-size: 19px\">Chưa áp dụng đổi trả<\u002Fspan>\n<span style=\"font-size: 15px; line-height: 1.6; color: #44403C\">Thực phẩm tươi sống, đông lạnh đã mang ra khỏi cửa hàng (trừ khi hàng có lỗi).<\u002Fspan>\n<span style=\"font-size: 15px; line-height: 1.6; color: #44403C\">Sản phẩm đã mở niêm phong vì lý do vệ sinh: đồ lót, mỹ phẩm, đồ dùng cá nhân.<\u002Fspan>\n<span style=\"font-size: 15px; line-height: 1.6; color: #44403C\">Sản phẩm hư hỏng do quá trình sử dụng hoặc bảo quản của khách.<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px\">\n<sc-for list=\"{{returnSteps}}\" as=\"rs\" hint-placeholder-count=\"3\">\n<div style=\"display: flex; gap: 16px; align-items: flex-start; border: 1px solid #E9DFCB; border-radius: 18px; padding: 20px 22px\">\n<span style=\"flex-shrink: 0; width: 40px; height: 40px; border-radius: 999px; background: {{accent}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 800\">{{rs.num}}<\u002Fspan>\n<span style=\"font-size: 16px; line-height: 1.55\">{{rs.text}}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fsc-if>\n\n<sc-if value=\"{{tabs.stores}}\" hint-placeholder-val=\"{{false}}\">\n<!-- STORES -->\n<div id=\"cua-hang\" style=\"max-width: 1200px; margin: 0 auto; padding: 96px 32px; display: flex; flex-direction: column; gap: 40px\">\n<div style=\"display: flex; flex-direction: column; gap: 12px; align-items: center; text-align: center\">\n<span style=\"color: {{accent}}; font-weight: 700; font-size: 15px; letter-spacing: 1.5px\">DANH SÁCH CỬA HÀNG ĐỐI TÁC<\u002Fspan>\n<h2 style=\"margin: 0; font-family: 'Bricolage Grotesque',Georgia,serif; font-weight: 800; font-size: 44px; line-height: 1.1\">Ghé cửa hàng gần bạn nhất<\u002Fh2>\n<p style=\"margin: 0; font-size: 17px; color: #57534E\">2 cửa hàng tại TP Huế, mở cửa 6:30 – 22:00 tất cả các ngày.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px\">\n<sc-for list=\"{{stores}}\" as=\"st\" hint-placeholder-count=\"2\">\n<div style=\"background: #FFFFFF; border: 1px solid #E9DFCB; border-radius: 24px; overflow: hidden; display: flex; flex-direction: column\">\n<div style=\"height: 220px; background: #EDE3CF; display: flex; align-items: center; justify-content: center; color: #78716C; font-weight: 600\">[BẢN ĐỒ / ẢNH {{st.name}}]<\u002Fdiv>\n<div style=\"padding: 26px 28px; display: flex; flex-direction: column; gap: 10px\">\n<span style=\"font-family: 'Bricolage Grotesque',Georgia,serif; font-weight: 800; font-size: 24px\">{{st.name}}<\u002Fspan>\n<span style=\"font-size: 16px; color: #44403C\">Địa chỉ: {{st.address}}<\u002Fspan>\n<span style=\"font-size: 16px; color: #44403C\">Giờ mở cửa: 6:30 – 22:00<\u002Fspan>\n<button type=\"button\" sc-camel-on-click=\"{{go.contact}}\" style=\"align-self: flex-start; margin-top: 6px; font-weight: 700; font-size: 16px; color: #9A1C12; padding: 0; border: none; background: none; font-family: inherit; cursor: pointer; text-align: left\">Xem đường đi →<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fsc-if>\n\n<sc-if value=\"{{tabs.faq}}\" hint-placeholder-val=\"{{false}}\">\n<!-- FAQ -->\n<div id=\"hoi-dap\" style=\"background: {{band.bg}}; border-top: 1px solid {{band.line}}; border-bottom: 1px solid {{band.line}}\">\n<div style=\"max-width: 900px; margin: 0 auto; padding: 96px 32px; display: flex; flex-direction: column; gap: 36px\">\n<div style=\"display: flex; flex-direction: column; gap: 12px; align-items: center; text-align: center\">\n<span style=\"color: {{accent}}; font-weight: 700; font-size: 15px; letter-spacing: 1.5px\">HỎI ĐÁP<\u002Fspan>\n<h2 style=\"margin: 0; font-family: 'Bricolage Grotesque',Georgia,serif; font-weight: 800; font-size: 44px; line-height: 1.1\">Câu hỏi thường gặp<\u002Fh2>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 14px\">\n<sc-for list=\"{{faqs}}\" as=\"f\" hint-placeholder-count=\"4\">\n<div style=\"background: #FBF6EC; border-radius: 18px; padding: 22px 26px; display: flex; flex-direction: column; gap: 8px\">\n<span style=\"font-weight: 700; font-size: 18px\">{{f.q}}<\u002Fspan>\n<span style=\"font-size: 16px; line-height: 1.6; color: #44403C\">{{f.a}}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fsc-if>\n\n<sc-if value=\"{{tabs.premises}}\" hint-placeholder-val=\"{{false}}\">\n<!-- FIND PREMISES -->\n<div id=\"tim-mat-bang\" style=\"background: {{panel.bg}}; color: {{panel.text}}\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 96px 32px; display: flex; flex-direction: column; gap: 48px\">\n<div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 56px; align-items: end\">\n<div style=\"display: flex; flex-direction: column; gap: 16px\">\n<span style=\"color: {{panel.hi}}; font-weight: 700; font-size: 15px; letter-spacing: 1.5px\">TÌM MẶT BẰNG<\u002Fspan>\n<h2 style=\"margin: 0; font-family: 'Bricolage Grotesque',Georgia,serif; font-weight: 800; font-size: 48px; line-height: 1.08\">Bạn có mặt bằng cho thuê? Hãy để Bách hóa tiết kiệm.com về gần nhà bạn<\u002Fh2>\n<\u002Fdiv>\n<p style=\"margin: 0; font-size: 17px; line-height: 1.7; color: {{panel.muted}}\">Chúng tôi đang tìm mặt bằng để mở thêm cửa hàng, mang hàng thiết yếu giá rẻ đến gần hơn với bà con. Nếu bạn có mặt bằng phù hợp, hoặc biết nơi đang cho thuê, xin liên hệ với chúng tôi.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px\">\n<sc-for list=\"{{premises}}\" as=\"pm\" hint-placeholder-count=\"4\">\n<div style=\"background: {{panel.inner}}; border-radius: 20px; padding: 24px; display: flex; flex-direction: column; gap: 10px\">\n<span style=\"color: {{panel.hi}}; font-weight: 700; font-size: 14px; letter-spacing: 1px\">{{pm.label}}<\u002Fspan>\n<span style=\"font-family: 'Bricolage Grotesque',Georgia,serif; font-weight: 800; font-size: 26px; line-height: 1.15\">{{pm.value}}<\u002Fspan>\n<span style=\"font-size: 15px; line-height: 1.55; color: {{panel.muted}}\">{{pm.desc}}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 32px; align-items: start\">\n<div style=\"display: flex; flex-direction: column; gap: 16px\">\n<span style=\"font-weight: 700; font-size: 20px\">Ưu tiên những vị trí<\u002Fspan>\n<sc-for list=\"{{premisePriority}}\" as=\"pp\" hint-placeholder-count=\"4\">\n<div style=\"display: flex; gap: 14px; align-items: flex-start\">\n<svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"{{panel.hi}}\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 2px\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg>\n<span style=\"font-size: 16px; line-height: 1.55; color: {{panel.muted}}\">{{pp.text}}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsc-for>\n<div style=\"margin-top: 12px; background: #F5B301; color: #1C1917; border-radius: 20px; padding: 22px 24px; display: flex; flex-direction: column; gap: 6px\">\n<span style=\"font-weight: 800; font-size: 18px\">Liên hệ về mặt bằng<\u002Fspan>\n<span style=\"font-size: 16px\">Gọi hoặc Zalo: <a href=\"tel:0356738758\" style=\"color: #1C1917; font-weight: 800\">0356 738 758<\u002Fa><\u002Fspan>\n<span style=\"font-size: 15px\">Người giới thiệu mặt bằng thành công: [CHÍNH SÁCH CẢM ƠN / HOA HỒNG]<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"background: #FFFFFF; color: #1C1917; border-radius: 24px; padding: 30px; display: flex; flex-direction: column; gap: 16px\">\n<span style=\"font-family: 'Bricolage Grotesque',Georgia,serif; font-weight: 800; font-size: 24px\">Gửi thông tin mặt bằng<\u002Fspan>\n<div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px\">\n<div style=\"display: flex; flex-direction: column; gap: 6px\">\n<label for=\"mb-ten\" style=\"font-weight: 600; font-size: 15px\">Họ và tên<\u002Flabel>\n<input id=\"mb-ten\" type=\"text\" style=\"height: 48px; border: 1px solid #C9B894; border-radius: 12px; padding: 0 14px; font-size: 16px; font-family: inherit\">\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 6px\">\n<label for=\"mb-sdt\" style=\"font-weight: 600; font-size: 15px\">Số điện thoại<\u002Flabel>\n<input id=\"mb-sdt\" type=\"tel\" style=\"height: 48px; border: 1px solid #C9B894; border-radius: 12px; padding: 0 14px; font-size: 16px; font-family: inherit\">\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 6px\">\n<label for=\"mb-dc\" style=\"font-weight: 600; font-size: 15px\">Địa chỉ mặt bằng<\u002Flabel>\n<input id=\"mb-dc\" type=\"text\" placeholder=\"Số nhà, đường, phường/xã\" style=\"height: 48px; border: 1px solid #C9B894; border-radius: 12px; padding: 0 14px; font-size: 16px; font-family: inherit\">\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px\">\n<div style=\"display: flex; flex-direction: column; gap: 6px\">\n<label for=\"mb-dt\" style=\"font-weight: 600; font-size: 15px\">Diện tích (m²)<\u002Flabel>\n<input id=\"mb-dt\" type=\"text\" style=\"height: 48px; border: 1px solid #C9B894; border-radius: 12px; padding: 0 14px; font-size: 16px; font-family: inherit\">\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 6px\">\n<label for=\"mb-mt\" style=\"font-weight: 600; font-size: 15px\">Mặt tiền (m)<\u002Flabel>\n<input id=\"mb-mt\" type=\"text\" style=\"height: 48px; border: 1px solid #C9B894; border-radius: 12px; padding: 0 14px; font-size: 16px; font-family: inherit\">\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 6px\">\n<label for=\"mb-gia\" style=\"font-weight: 600; font-size: 15px\">Giá thuê/tháng<\u002Flabel>\n<input id=\"mb-gia\" type=\"text\" style=\"height: 48px; border: 1px solid #C9B894; border-radius: 12px; padding: 0 14px; font-size: 16px; font-family: inherit\">\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 6px\">\n<label for=\"mb-gc\" style=\"font-weight: 600; font-size: 15px\">Ghi chú<\u002Flabel>\n<textarea id=\"mb-gc\" rows=\"3\" placeholder=\"Hiện trạng, thời hạn cho thuê, thời gian có thể bàn giao...\" style=\"border: 1px solid #C9B894; border-radius: 12px; padding: 12px 14px; font-size: 16px; font-family: inherit; resize: vertical\"><\u002Ftextarea>\n<\u002Fdiv>\n<button type=\"button\" style=\"height: 52px; border: none; border-radius: 999px; background: {{accent}}; color: {{panel.text}}; font-weight: 700; font-size: 17px; font-family: inherit; cursor: pointer\">Gửi thông tin mặt bằng<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fsc-if>\n\n<sc-if value=\"{{tabs.franchise}}\" hint-placeholder-val=\"{{false}}\">\n<!-- FRANCHISE -->\n<div id=\"nhuong-quyen\" style=\"max-width: 1200px; margin: 0 auto; padding: 96px 32px; display: flex; flex-direction: column; gap: 48px\">\n<div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 56px; align-items: end\">\n<div style=\"display: flex; flex-direction: column; gap: 16px\">\n<span style=\"color: {{accent}}; font-weight: 700; font-size: 15px; letter-spacing: 1.5px\">TÌM ĐỐI TÁC NHƯỢNG QUYỀN<\u002Fspan>\n<h2 style=\"margin: 0; font-family: 'Bricolage Grotesque',Georgia,serif; font-weight: 800; font-size: 48px; line-height: 1.08\">Cùng mở Bách hóa tiết kiệm.com tại địa phương của bạn<\u002Fh2>\n<\u002Fdiv>\n<p style=\"margin: 0; font-size: 17px; l font-weight: 800; font-size: 44px; line-height: 1.1\">Chúng tôi muốn nghe quý khách nói<\u002Fh2>\n<p style=\"margin: 0; font-size: 17px; line-height: 1.6\">Mỗi góp ý, dù khen hay chê, đều giúp cửa hàng phục vụ tốt hơn. Gọi điện hoặc Zalo, nói trực tiếp với thành viên cửa hàng, hoặc để lại lời nhắn bên cạnh. Mọi góp ý đều được phản hồi trong ngày.<\u002Fp>\n<a href=\"tel:0356738758\" style=\"align-self: flex-start; color: #1C1917; background: #F5B301; text-decoration: none; font-weight: 800; font-size: 22px; padding: 14px 26px; border-radius: 999px\">0356 738 758<\u002Fa>\n<\u002Fdiv>\n<div style=\"background: #FFFFFF; color: #1C1917; border-radius: 24px; padding: 30px; display: flex; flex-direction: column; gap: 16px\">\n<div style=\"display: flex; flex-direction: column; gap: 6px\">\n<label for=\"ten\" style=\"font-weight: 600; font-size: 15px\">Họ và tên<\u002Flabel>\n<input id=\"ten\" type=\"text\" placeholder=\"Nguyễn Văn A\" style=\"height: 48px; border: 1px solid #C9B894; border-radius: 12px; padding: 0 14px; font-size: 16px; font-family: inherit\">\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 6px\">\n<label for=\"sdt\" style=\"font-weight: 600; font-size: 15px\">Số điện thoại<\u002Flabel>\n<input id=\"sdt\" type=\"tel\" placeholder=\"09xx xxx xxx\" style=\"height: 48px; border: 1px solid #C9B894; border-radius: 12px; padding: 0 14px; font-size: 16px; font-family: inherit\">\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 6px\">\n<label for=\"nd\" style=\"font-weight: 600; font-size: 15px\">Góp ý hoặc câu hỏi của bạn<\u002Flabel>\n<textarea id=\"nd\" rows=\"3\" placeholder=\"Hỏi về điểm tích lũy, đặt hàng, góp ý...\" style=\"border: 1px solid #C9B894; border-radius: 12px; padding: 12px 14px; font-size: 16px; font-family: inherit; resize: vertical\"><\u002Ftextarea>\n<\u002Fdiv>\n<button type=\"button\" style=\"height: 52px; border: none; border-radius: 999px; background: {{panel.bg}}; color: {{panel.text}}; font-weight: 700; font-size: 17px; font-family: inherit; cursor: pointer\">Gửi góp ý<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fsc-if>\n\n<!-- FOOTER -->\n<div style=\"background: {{panel.bg}}; color: {{panel.muted}}\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 56px 32px 32px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 40px\">\n<div style=\"display: flex; flex-direction: column; gap: 10px\">\n<span style=\"font-family: 'Bricolage Grotesque',Georgia,serif; font-weight: 800; font-size: 24px; color: {{panel.text}}\">Bách hóa tiết kiệm<span style=\"color: {{panel.hi}}\">.com<\u002Fspan><\u002Fspan>\n<span style=\"font-size: 15px; line-height: 1.6\">Luôn luôn giá rẻ · Luôn luôn sạch sẽ · Luôn luôn vui vẻ<\u002Fspan>\n<span style=\"font-size: 14px\">Phụng sự bằng trái tim chân thành<\u002Fspan>\n\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 10px; font-size: 15px\">\n<span style=\"font-weight: 700; color: {{panel.text}}\">Liên hệ<\u002Fspan>\n<span>Hotline: 0356 738 758<\u002Fspan>\n<span>Website: bachhoatietkiem.com<\u002Fspan>\n<span>Fanpage: Bách hóa tiết kiệm<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 10px; font-size: 15px\">\n<span style=\"font-weight: 700; color: {{panel.text}}\">Giờ mở cửa<\u002Fspan>\n<span>6:30 – 22:00, tất cả các ngày trong tuần<\u002Fspan>\n<span>Cửa hàng số 1: [SỐ NHÀ, TÊN ĐƯỜNG], TP Huế<\u002Fspan>\n<span>Cửa hàng số 2: [SỐ NHÀ, TÊN ĐƯỜNG], TP Huế<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 20px 32px 32px; border-top: 1px solid {{panel.line}}; font-size: 13px; color: {{panel.muted}}\">© 2026 Bách hóa tiết kiệm.com<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#B42318&quot;,&quot;options&quot;:[&quot;#B42318&quot;,&quot;#C2410C&quot;,&quot;#15803D&quot;,&quot;#1D4ED8&quot;]},&quot;panelTone&quot;:{&quot;editor&quot;:&quot;select&quot;,&quot;label&quot;:&quot;Màu khung&quot;,&quot;default&quot;:&quot;Bìa carton&quot;,&quot;options&quot;:[&quot;Bìa carton&quot;,&quot;Cà phê sữa&quot;,&quot;Nâu đỏ&quot;]},&quot;pageTone&quot;:{&quot;editor&quot;:&quot;select&quot;,&quot;label&quot;:&quot;Nền trang&quot;,&quot;default&quot;:&quot;Bìa carton&quot;,&quot;options&quot;:[&quot;Bìa carton&quot;,&quot;Kem trơn&quot;]},&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:1600}}\">\nclass Component extends DCLogic {\n  constructor(props) { super(props); this.state = { tab: 'home' }; }\n  renderVals() {\n    const keys = ['home','about','mission','aisles','returns','stores','faq','premises','franchise','jobs','contact'];\n    const accent = this.props.accent ?? '#B42318';\n    const cur = (this.state && this.state.tab) || 'home';\n    const go = {}, tabs = {}, nav = {};\n    keys.forEach((k) => {\n      go[k] = () => { this.setState({ tab: k }); try { window.scrollTo({ top: 0, behavior: 'smooth' }); } catch (e) {} };\n      tabs[k] = cur === k;\n      nav[k] = { color: cur === k ? accent : '#1C1917', line: cur === k ? accent : 'transparent' };\n    });\n    const tones = {\n      'Bìa carton': { bg: '#E0C39B', inner: '#E9D1AF', line: '#C09C70', text: '#2B1D12', muted: '#4A3524', hi: '#7A2A1C' },\n      'Cà phê sữa': { bg: '#8A5A3B', inner: '#9B6B4B', line: '#B08868', text: '#FBF6EC', muted: '#F3E6DA', hi: '#FDE9A8' },\n      'Nâu đỏ': { bg: '#7A2A1C', inner: '#8E3726', line: '#B0584A', text: '#FBF6EC', muted: '#F3E6DA', hi: '#FDE9A8' }\n    };\n    const panel = tones[this.props.panelTone] || tones['Bìa carton'];\n    return {\n      go, tabs, nav, panel,\n      pageClass: this.props.pageTone === 'Kem trơn' ? 'nen-kem' : 'nen-carton',\n      band: this.props.pageTone === 'Kem trơn' ? { bg: '#FFFFFF', line: '#E9DFCB' } : { bg: 'rgba(255,255,255,0.18)', line: 'rgba(120,80,40,0.25)' },\n      accent: this.props.accent ?? '#B42318',\n      categories: [\n        { num: '1', name: 'Snack & kẹo', where: 'Kệ giữa', desc: 'Snack, kẹo, socola, các loại hạt, trái cây sấy' },\n        { num: '2', name: 'Bánh, trà, cà phê & ngũ cốc', where: 'Kệ giữa', desc: 'Bánh quy, bánh hộp, trà túi lọc, cà phê gói, ngũ cốc dinh dưỡng' },\n        { num: '3', name: 'Đồ gia dụng & học tập', where: 'Kệ giữa', desc: 'Đồ dùng nhà bếp, hộp đựng, chổi, móc treo, tập vở, bút, dụng cụ học tập' },\n        { num: '4', name: 'Gạo, mì & đồ khô', where: 'Kệ giữa', desc: 'Gạo, mì gói, bún, miến, phở khô, các loại đậu' },\n        { num: '5', name: 'Gia vị & dầu ăn', where: 'Kệ giữa', desc: 'Nước mắm, nước tương, muối, đường, bột ngọt, dầu ăn' },\n        { num: '6', name: 'Nước giải khát', where: 'Tường trái', desc: 'Nước suối, nước ngọt, nước tăng lực, trà đóng chai, bia' },\n        { num: '7', name: 'Sữa các loại', where: 'Tường sau', desc: 'Sữa tươi, sữa hộp, sữa chua, sữa bột, sữa đặc' },\n        { num: '8', name: 'Hóa phẩm & chăm sóc cá nhân', where: 'Tường phải', desc: 'Bột giặt, nước rửa chén, dầu gội, sữa tắm, kem đánh răng, giấy vệ sinh' }\n      ],\n      reasons: [\n        { num: '01', title: 'Giá thấp mỗi ngày', desc: 'Giá rẻ ổn định, không phải chờ đến ngày khuyến mãi mới mua được giá tốt.' },\n        { num: '02', title: 'Gần nhà, mở cửa sớm', desc: 'Mở cửa từ 6:30 đến 22:00 – tiện ghé trước giờ làm hay sau giờ tan ca.' },\n        { num: '03', title: 'Thành viên tận tâm', desc: 'Thành viên cửa hàng luôn sẵn sàng giúp bạn tìm hàng và giải đáp thắc mắc.' },\n        { num: '04', title: 'Đổi trả 30 ngày', desc: 'Đổi hàng hoặc hoàn tiền ngay tại quầy, nhanh chóng và vui vẻ.' }\n      ],\n      principles: [\n        { num: '01', span: 'span 3', title: 'Giá thấp mỗi ngày', desc: 'Giá rẻ ổn định mỗi ngày, không chạy theo khuyến mãi ngắn hạn. Mọi chiết khấu, ưu đãi từ nhà cung cấp đều dành để mang lại giá tốt hơn cho khách hàng.' },\n        { num: '02', span: 'span 3', title: 'Chi phí thấp nhất', desc: 'Vận hành tinh gọn, tập trung vào hàng thiết yếu, cắt bỏ mọi chi phí không mang lại giá trị cho khách. Tiết kiệm được bao nhiêu, giảm giá cho khách bấy nhiêu.' },\n        { num: '03', span: 'span 2', title: 'Khách hàng là số 1', desc: 'Phục vụ khách luôn là việc quan trọng nhất trong ngày. Chủ động chào đón, dẫn khách đến tận kệ, đổi trả nhanh chóng và vui vẻ.' },\n        { num: '04', span: 'span 2', title: 'Văn hóa 1 đồng', desc: 'Trân trọng từng đồng của khách và của cửa hàng: tính tiền đúng, đủ đến từng đồng; không lãng phí một đồng; mỗi đồng tiết kiệm được là một đồng giảm giá cho khách.' },\n        { num: '05', span: 'span 2', title: 'Trách nhiệm là trên hết', desc: 'Trách nhiệm là làm đúng, ngay cả khi không ai nhìn thấy. Ở đây không có câu “đó không phải việc của tôi”: mỗi thành viên xem cửa hàng như của chính mình – tự thấy việc mà làm, không đợi ai nhắc. Chúng tôi có trách nhiệm với khách hàng, những người đã tin mà chọn ghé; với đồng đội, những người đang cùng gánh một ca làm; và với chính mình, vì cách mình làm việc hôm nay chính là con người mình ngày mai. Mỗi thành viên là người chủ của phần việc mình nhận: làm đến nơi đến chốn, không đùn đẩy, không để việc hôm nay sang ngày mai. Việc riêng không cấp thiết không bao giờ là lý do để làm dở dang việc đã nhận. Đã nhận là làm đến cùng và làm cho thật tốt; có sai thì nhận, khắc phục và không để lặp lại.' }\n      ],\n      franchiseFigures: [\n        { label: 'VỐN ĐẦU TƯ DỰ KIẾN', value: '[TỪ … TRIỆU ĐỒNG]' },\n        { label: 'DIỆN TÍCH CỬA HÀNG', value: '[TỪ … m²]' },\n        { label: 'PHÍ NHƯỢNG QUYỀN', value: '[… ĐỒNG]' },\n        { label: 'THỜI HẠN HỢP ĐỒNG', value: '[… NĂM]' }\n      ],\n      franchiseGets: [\n        { title: 'Thương hiệu & nhận diện', desc: 'Tên, logo, slogan \"Luôn luôn giá rẻ!\", bảng hiệu và trọn bộ poster cửa hàng.' },\n        { title: 'Sơ đồ bố trí 8 dãy hàng', desc: 'Cách sắp xếp kệ, bảng treo dãy hàng, quầy thu ngân và quầy giữ đồ đã áp dụng tại cửa hàng.' },\n        { title: 'Bộ chuẩn mực vận hành', desc: '6 chuẩn mực phục vụ, nội quy cửa hàng, quy định làm việc và chính sách đổi trả 30 ngày.' },\n        { title: 'Đào tạo thành viên cửa hàng', desc: '[NỘI DUNG ĐÀO TẠO: bán hàng, thu ngân, quản lý hàng hóa…]' },\n        { title: 'Nguồn hàng', desc: '[CHÍNH SÁCH CUNG ỨNG HÀNG HÓA CHO ĐỐI TÁC]' },\n        { title: 'Hỗ trợ khai trương', desc: '[HỖ TRỢ SETUP, TRUYỀN THÔNG KHAI TRƯƠNG]' }\n      ],\n      franchiseSteps: [\n        { num: '01', title: 'Liên hệ tư vấn', desc: 'Gọi hotline hoặc gửi form đăng ký bên cạnh.' },\n        { num: '02', title: 'Khảo sát mặt bằng', desc: 'Cùng đánh giá vị trí, diện tích và khu dân cư xung quanh.' },\n        { num: '03', title: 'Ký hợp đồng', desc: 'Thống nhất điều khoản, chi phí và lộ trình.' },\n        { num: '04', title: 'Setup & đào tạo', desc: 'Lắp đặt kệ, nhập hàng, đào tạo thành viên cửa hàng.' },\n        { num: '05', title: 'Khai trương', desc: 'Mở cửa đón khách với cam kết luôn luôn giá rẻ.' }\n      ],\n      franchiseNeeds: [\n        { text: 'Đồng lòng với triết lý giá thấp mỗi ngày và phục vụ bằng trái tim chân thành.' },\n        { text: 'Có mặt bằng phù hợp, hoặc sẵn sàng cùng chúng tôi tìm mặt bằng.' },\n        { text: 'Có nguồn vốn đầu tư theo mức dự kiến.' },\n        { text: 'Trực tiếp quản lý hoặc cử người quản lý, tuân thủ bộ chuẩn mực vận hành.' }\n      ],\n      jobs: [\n        { title: 'Thành viên bán hàng', desc: 'Sắp xếp hàng lên kệ, kiểm tra hạn sử dụng, chào đón và hướng dẫn khách tìm hàng.', qty: '[SỐ LƯỢNG]', time: '[CA LÀM VIỆC]', pay: '[MỨC LƯƠNG]' },\n        { title: 'Thu ngân', desc: 'Tính tiền đúng, đủ cho khách; tích điểm, hỗ trợ đổi trả tại quầy; đếm tiền đầu và cuối ca.', qty: '[SỐ LƯỢNG]', time: '[CA LÀM VIỆC]', pay: '[MỨC LƯƠNG]' },\n        { title: 'Quản lý cửa hàng', desc: 'Điều phối ca làm, quản lý hàng hóa và tiền quầy, tiếp nhận góp ý của khách hàng.', qty: '[SỐ LƯỢNG]', time: '[CA LÀM VIỆC]', pay: '[MỨC LƯƠNG]' }\n      ],\n      jobNeeds: [\n        { text: 'Trung thực, tính tiền đúng và đủ với mọi khách, kể cả người quen.' },\n        { text: 'Đúng giờ, gọn gàng, có trách nhiệm với công việc được giao.' },\n        { text: 'Vui vẻ, niềm nở, thích trò chuyện và giúp đỡ khách hàng.' },\n        { text: 'Sống gần cửa hàng là một lợi thế.' }\n      ],\n      jobPerks: [\n        { text: 'Được hướng dẫn công việc từ đầu, không yêu cầu kinh nghiệm.' },\n        { text: 'Làm việc gần nhà, môi trường thân thiện.' },\n        { text: '[CHẾ ĐỘ: thưởng, bảo hiểm, phụ cấp, nghỉ phép…]' },\n        { text: '[CƠ HỘI THĂNG TIẾN: ví dụ lên quản lý cửa hàng]' }\n      ],\n      premises: [\n        { label: 'DIỆN TÍCH', value: '[TỪ … m²]', desc: 'Đủ chỗ cho các dãy kệ hàng, quầy thu ngân và kho nhỏ.' },\n        { label: 'MẶT TIỀN', value: '[TỪ … m]', desc: 'Mặt tiền thoáng, dễ nhìn thấy từ đường, có chỗ để xe cho khách.' },\n        { label: 'THỜI HẠN THUÊ', value: '[TỪ … NĂM]', desc: 'Ưu tiên hợp đồng thuê dài hạn, ổn định.' },\n        { label: 'KHU VỰC', value: 'TP Huế', desc: 'Các phường, xã đông dân cư trong TP Huế và vùng lân cận.' }\n      ],\n      premisePriority: [\n        { text: 'Gần khu dân cư đông đúc, chợ, trường học hoặc khu công nghiệp.' },\n        { text: 'Nằm trên tuyến đường có nhiều người qua lại, dễ dừng đỗ xe máy.' },\n        { text: 'Mặt bằng trống, khô ráo, có sẵn điện nước; bàn giao được sớm.' },\n        { text: 'Giấy tờ rõ ràng, chủ nhà ký hợp đồng trực tiếp.' }\n      ],\n      returnSteps: [\n        { num: '1', text: 'Mang sản phẩm và hóa đơn đến quầy thu ngân.' },\n        { num: '2', text: 'Thành viên cửa hàng kiểm tra và hỏi quý khách muốn đổi hay hoàn tiền.' },\n        { num: '3', text: 'Hoàn tất ngay tại quầy, không để quý khách phải chờ lâu.' }\n      ],\n      steps: [\n        { num: '1', title: 'Khách hàng là ông chủ', desc: 'Phục vụ khách luôn là việc quan trọng nhất trong ngày.' },\n        { num: '2', title: 'Luôn làm khách hài lòng', desc: 'Giải quyết vấn đề thật nhanh; mắc lỗi thì xin lỗi và sửa ngay.' },\n        { num: '3', title: 'Quy tắc Mặt trời lặn', desc: 'Tin nhắn, cuộc gọi của khách được phản hồi ngay trong ngày.' },\n        { num: '4', title: 'Quy tắc 10 bước chân', desc: 'Chủ động chào khách và dẫn khách đến tận kệ hàng.' },\n        { num: '5', title: 'Tặng khách một món quà nhỏ', desc: 'Một nụ cười, xách giúp túi nặng, cùng khách tìm đúng món cần.' },\n        { num: '6', title: 'Chào đón mọi người', desc: 'Chào khi khách đến, cảm ơn và mời khách quay lại khi ra về.' }\n      ],\n      stores: [\n        { name: 'Cửa hàng số 1', address: '[SỐ NHÀ, TÊN ĐƯỜNG], TP Huế' },\n        { name: 'Cửa hàng số 2', address: '[SỐ NHÀ, TÊN ĐƯỜNG], TP Huế' }\n      ],\n      faqs: [\n        { q: 'Cửa hàng mở cửa lúc mấy giờ?', a: 'Từ 6:30 đến 22:00 tất cả các ngày trong tuần.' },\n        { q: 'Tôi có được đổi trả hàng không?', a: 'Có. Trong vòng 30 ngày kể từ ngày mua, quý khách mang sản phẩm và hóa đơn đến quầy thu ngân để đổi hoặc hoàn tiền. Hàng lỗi, hết hạn được đổi ngay.' },\n        { q: 'Tôi cần lưu ý gì khi vào cửa hàng?', a: 'Vui lòng gửi túi xách, balo lớn tại quầy giữ đồ; không hút thuốc, không mang thú cưng; thanh toán trước khi dùng sản phẩm và giữ lại hóa đơn.' },\n        { q: 'Tôi có thể đặt hàng qua điện thoại không?', a: '[TRẢ LỜI THEO CHÍNH SÁCH CỬA HÀNG] – vui lòng gọi hotline 0356 738 758 để được hỗ trợ.' }\n      ]\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
